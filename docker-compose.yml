# Production: everything the container serves is inside the image.
# Development (live edits, no rebuild):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  icon-library:
    build:
      context: .
      dockerfile: Dockerfile
    image: icon-library:latest
    container_name: icon-library
    restart: unless-stopped
    # Forwards SIGTERM to Node, so the container stops at once
    init: true
    ports:
      - "3000:3000"
    environment:
      # Public address, used in sitemap.xml and robots.txt
      SITE_URL: "https://iconlibrary.io"
      # Google AdSense publisher ID (pub-…); enables /ads.txt
      ADSENSE_PUBLISHER_ID: ""
      # Behind the reverse proxy: client IP (rate limits) from X-Forwarded-For
      TRUST_PROXY: "true"
    # Secrets (Stripe, PostgreSQL) stay out of this file: copy .env.example to
    # .env and fill it in. Without it the site runs, just without the coffee.
    env_file:
      - path: .env
        required: false
    # PostgreSQL running on the same server, outside Docker: use
    # PG_HOST=host.docker.internal in .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hardening: the server only reads files and listens on a high port
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
