# Checks every push and pull request: tests, syntax of every script, and that
# the Docker image builds and answers its healthcheck.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The moderation previews need the SVG→PNG renderer (@resvg/resvg-js)
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Syntax of every script
        run: |
          for f in public/js/views/goTop.js public/js/views/theme.js scripts/*.js; do
            node --check "$f"
          done
          for f in $(find public/js -name '*.js' ! -name goTop.js ! -name theme.js); do
            node --input-type=module --check < "$f"
          done

  docker:
    runs-on: ubuntu-26.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t icon-library:ci .

      # The renderer is a native binary: check that it loads inside the image
      - name: PNG previews work in the image
        run: |
          docker run --rm --entrypoint node icon-library:ci -e "
            const p = require('/app/scripts/preview.js');
            if (!p.previewAvailable()) throw new Error('renderer missing');
            const png = p.renderPng('<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\"/></svg>', 64);
            if (png.readUInt32BE(16) !== 64) throw new Error('wrong size');
            console.log('preview ok');"

      - name: Start and wait for the healthcheck
        run: |
          docker run -d --name icon-library-ci -p 3000:3000 icon-library:ci
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' icon-library-ci)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          [ "$status" = "healthy" ]
          curl -fsS http://localhost:3000/ | grep -q "<title>Icon Library"
          # Main page in another language: canonical and lang for search engines
          curl -fsS "http://localhost:3000/?lang=pt-BR" | grep -q 'rel="canonical" href="https://iconlibrary.io/?lang=pt-BR"'
          curl -fsS "http://localhost:3000/?lang=pt-BR" | grep -q '<html lang="pt-BR"'
